<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shaheen · Chapter Presentations</title>
<style>
:root{--navy:#021a30;--navy2:#032a4a;--blue:#00569d;--sky:#8ab5d6;--gold:#fecd0b;--line:rgba(138,181,214,.22);--green:#33d6a0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 Inter,system-ui,sans-serif;background:var(--navy);color:#dcecf8;display:grid;grid-template-columns:320px 1fr;grid-template-rows:60px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 20px;background:#01111f;border-bottom:1px solid var(--line)}
header .logo{font:800 20px Montserrat,system-ui,sans-serif;letter-spacing:.12em;color:#fff}header .logo small{display:block;font:600 9px Montserrat,sans-serif;letter-spacing:.34em;color:var(--sky)}
header .crumb{flex:1;color:var(--sky);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .crumb b{color:#fff}
header .prog{font:700 13px Montserrat,sans-serif;color:var(--gold);letter-spacing:.06em}
header button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
header button:hover:not(:disabled){border-color:var(--gold)}header button:disabled{opacity:.35;cursor:default}
nav{overflow:auto;padding:14px 12px 30px;background:linear-gradient(180deg,#02203a,#01111f);border-right:1px solid var(--line)}
nav h3{margin:16px 8px 6px;font:800 11px Montserrat,sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
nav details{margin:2px 0}nav summary{cursor:pointer;padding:9px 10px;border-radius:10px;font-weight:700;color:#fff;list-style:none}
nav summary::before{content:'▸ ';color:var(--sky)}nav details[open]>summary::before{content:'▾ '}
nav summary:hover{background:rgba(255,255,255,.06)}
nav .sub{padding-left:14px}
nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;color:#cfe0ee;text-decoration:none;font-size:14px;cursor:pointer}
nav a i{font:700 12px Montserrat,sans-serif;font-style:normal;color:var(--sky);width:22px;flex:none}
nav a:hover{background:rgba(255,255,255,.07)}nav a.cur{background:rgba(254,205,11,.14);color:#fff;box-shadow:inset 3px 0 var(--gold)}
nav a.soon{opacity:.45;cursor:default}nav a.soon::after{content:'soon';margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
main{position:relative;background:#000}main iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;background:radial-gradient(circle at 70% 20%,#06325a,var(--navy))}
.empty h2{font:800 34px Montserrat,sans-serif;color:#fff;margin:0 0 10px}.empty p{color:var(--sky);max-width:520px;margin:0 auto}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:60px auto 1fr}nav{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}header{grid-column:1}}
</style></head><body>
<header><div class="logo">SHAHEEN<small>ACADEMY MUMBAI</small></div><div class="crumb" id="crumb">Choose a chapter</div><div class="prog" id="prog"></div><button id="prev">◀ Chapter</button><button id="next">Chapter ▶</button></header>
<nav id="nav"></nav>
<main id="main"><div class="empty" id="empty"><div><h2>Chapter presentations</h2><p>Pick a class, subject and chapter from the left. Chapters marked “soon” are not built yet.</p></div></div></main>
<script>
var MANIFEST={"school": "Shaheen Group of Institutions", "exam": "NEET", "classes": [{"id": "class-11", "name": "Class XI", "subjects": [{"id": "physics", "name": "Physics", "chapters": [{"n": 1, "id": "01-units-and-measurements", "title": "Units and Measurements", "status": "ready"}, {"n": 2, "id": "02-motion-in-a-straight-line", "title": "Motion in a Straight Line", "status": "soon"}, {"n": 3, "id": "03-motion-in-a-plane", "title": "Motion in a Plane", "status": "soon"}, {"n": 4, "id": "04-laws-of-motion", "title": "Laws of Motion", "status": "soon"}, {"n": 5, "id": "05-work-energy-and-power", "title": "Work, Energy and Power", "status": "soon"}, {"n": 6, "id": "06-system-of-particles-and-rotational-motion", "title": "System of Particles and Rotational Motion", "status": "soon"}, {"n": 7, "id": "07-gravitation", "title": "Gravitation", "status": "soon"}, {"n": 8, "id": "08-mechanical-properties-of-solids", "title": "Mechanical Properties of Solids", "status": "soon"}, {"n": 9, "id": "09-mechanical-properties-of-fluids", "title": "Mechanical Properties of Fluids", "status": "soon"}, {"n": 10, "id": "10-thermal-properties-of-matter", "title": "Thermal Properties of Matter", "status": "soon"}, {"n": 11, "id": "11-thermodynamics", "title": "Thermodynamics", "status": "soon"}, {"n": 12, "id": "12-kinetic-theory", "title": "Kinetic Theory", "status": "soon"}, {"n": 13, "id": "13-oscillations", "title": "Oscillations", "status": "soon"}, {"n": 14, "id": "14-waves", "title": "Waves", "status": "soon"}]}, {"id": "chemistry", "name": "Chemistry", "chapters": []}, {"id": "biology", "name": "Biology", "chapters": []}]}, {"id": "class-12", "name": "Class XII", "subjects": [{"id": "physics", "name": "Physics", "chapters": [{"n": 1, "id": "01-electric-charges-and-fields", "title": "Electric Charges and Fields", "status": "soon"}, {"n": 2, "id": "02-electrostatic-potential-and-capacitance", "title": "Electrostatic Potential and Capacitance", "status": "soon"}, {"n": 3, "id": "03-current-electricity", "title": "Current Electricity", "status": "soon"}, {"n": 4, "id": "04-moving-charges-and-magnetism", "title": "Moving Charges and Magnetism", "status": "soon"}, {"n": 5, "id": "05-magnetism-and-matter", "title": "Magnetism and Matter", "status": "soon"}, {"n": 6, "id": "06-electromagnetic-induction", "title": "Electromagnetic Induction", "status": "soon"}, {"n": 7, "id": "07-alternating-current", "title": "Alternating Current", "status": "soon"}, {"n": 8, "id": "08-electromagnetic-waves", "title": "Electromagnetic Waves", "status": "soon"}, {"n": 9, "id": "09-ray-optics-and-optical-instruments", "title": "Ray Optics and Optical Instruments", "status": "soon"}, {"n": 10, "id": "10-wave-optics", "title": "Wave Optics", "status": "soon"}, {"n": 11, "id": "11-dual-nature-of-radiation-and-matter", "title": "Dual Nature of Radiation and Matter", "status": "soon"}, {"n": 12, "id": "12-atoms", "title": "Atoms", "status": "soon"}, {"n": 13, "id": "13-nuclei", "title": "Nuclei", "status": "soon"}, {"n": 14, "id": "14-semiconductor-electronics", "title": "Semiconductor Electronics", "status": "soon"}]}, {"id": "chemistry", "name": "Chemistry", "chapters": []}, {"id": "biology", "name": "Biology", "chapters": []}]}]};
(function(){
var nav=document.getElementById('nav'),main=document.getElementById('main'),empty=document.getElementById('empty'),crumb=document.getElementById('crumb'),prog=document.getElementById('prog');
var flat=[],frame=null,cur=-1;
MANIFEST.classes.forEach(function(c){c.subjects.forEach(function(s){s.chapters.forEach(function(ch){ch.path='/'+c.id+'/'+s.id+'/'+ch.id+'/index.html';ch.path=ch.path.slice(1);
  flat.push({c:c,s:s,ch:ch,key:c.id+'/'+s.id+'/'+ch.id})})})});
function el(t,a,h){var e=document.createElement(t);for(var k in a||{})e.setAttribute(k,a[k]);if(h!=null)e.innerHTML=h;return e}
MANIFEST.classes.forEach(function(c,ci){
  nav.appendChild(el('h3',0,c.name));
  c.subjects.forEach(function(s,si){var d=el('details',{});if(ci===0&&si===0)d.open=true;d.appendChild(el('summary',0,s.name+(s.chapters.some(function(x){return x.status==='ready'})?'':' <span style="color:var(--sky);font-weight:500;font-size:12px">· soon</span>')));
    var box=el('div',{class:'sub'});
    s.chapters.forEach(function(ch){var f=flat.filter(function(x){return x.ch===ch})[0];var a=el('a',{class:ch.status==='ready'?'':'soon','data-k':f.key},'<i>'+ch.n+'</i><span>'+ch.title+'</span>');
      if(ch.status==='ready')a.addEventListener('click',function(){open(f.key)});box.appendChild(a)});
    if(!s.chapters.length)box.appendChild(el('a',{class:'soon'},'<span>No chapters yet</span>'));
    d.appendChild(box);nav.appendChild(d)})});
function idx(key){for(var i=0;i<flat.length;i++)if(flat[i].key===key)return i;return -1}
function ready(i,dir){for(i+=dir;i>=0&&i<flat.length;i+=dir)if(flat[i].ch.status==='ready'&&flat[i].s===flat[cur<0?0:cur].s)return i;return -1}
function open(key){var i=idx(key);if(i<0||flat[i].ch.status!=='ready')return;cur=i;var f=flat[i];
  if(frame)frame.remove();frame=el('iframe',{src:f.ch.path,allow:'fullscreen',title:f.ch.title});main.appendChild(frame);empty.style.display='none';
  crumb.innerHTML=f.c.name+' › '+f.s.name+' › <b>'+f.ch.title+'</b>';prog.textContent='';
  [].forEach.call(nav.querySelectorAll('a'),function(a){a.classList.toggle('cur',a.getAttribute('data-k')===key)});
  try{history.replaceState(null,'','#'+key)}catch(e){}
  document.getElementById('prev').disabled=ready(i,-1)<0;document.getElementById('next').disabled=ready(i,1)<0;frame.focus()}
document.getElementById('next').onclick=function(){var j=ready(cur,1);if(j>=0)open(flat[j].key)};
document.getElementById('prev').onclick=function(){var j=ready(cur,-1);if(j>=0)open(flat[j].key)};
window.addEventListener('message',function(e){var d=e.data;if(!d||d.source!=='shaheen-deck')return;
  if(d.type==='slidechange')prog.textContent='Slide '+(d.index+1)+' / '+d.total;
  if(d.type==='next-chapter'){var j=ready(cur,1);if(j>=0)open(flat[j].key);else alert('The next chapter is not available yet.')}});
var h=location.hash.slice(1);if(h&&idx(h)>=0)open(h);else{var f=flat.filter(function(x){return x.ch.status==='ready'})[0];if(f)open(f.key)}
})();
</script></body></html>
