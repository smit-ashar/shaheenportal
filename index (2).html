<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shaheen · Chapter Library</title>
<style>
:root{--navy:#021a30;--navy2:#032a4a;--blue:#00569d;--sky:#8ab5d6;--gold:#fecd0b;--line:rgba(138,181,214,.22);--green:#33d6a0;--rose:#ff7a6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 Inter,system-ui,"Segoe UI",sans-serif;background:var(--navy);color:#dcecf8;display:grid;grid-template-columns:290px 1fr;grid-template-rows:62px 1fr;overflow:hidden}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;background:#01111f;border-bottom:1px solid var(--line)}
.logo{font:800 19px Montserrat,system-ui,sans-serif;letter-spacing:.12em;color:#fff;cursor:pointer}.logo small{display:block;font:600 9px Montserrat,sans-serif;letter-spacing:.34em;color:var(--sky)}
.crumbs{flex:1;display:flex;align-items:center;gap:4px;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:6px 10px;overflow:hidden;white-space:nowrap}
.crumbs a{color:var(--sky);cursor:pointer;padding:3px 7px;border-radius:6px;font-weight:600}.crumbs a:hover{background:rgba(255,255,255,.1);color:#fff}.crumbs a:last-child{color:#fff}.crumbs i{font-style:normal;color:var(--sky);opacity:.6}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:8px 13px;font:600 13px Inter,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--gold)}.btn:disabled{opacity:.35;cursor:default}.btn.on{background:rgba(254,205,11,.16);border-color:var(--gold)}
.prog{font:700 13px Montserrat,sans-serif;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
nav{overflow:auto;padding:12px 10px 30px;background:linear-gradient(180deg,#02203a,#01111f);border-right:1px solid var(--line)}
nav .t{margin:6px 8px 10px;font:800 11px Montserrat,sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.tr{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;color:#cfe0ee;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr:hover{background:rgba(255,255,255,.07)}.tr.cur{background:rgba(254,205,11,.14);color:#fff;box-shadow:inset 3px 0 var(--gold)}.tr.soon{opacity:.45}
.tr svg{width:18px;height:18px;flex:none}.tr .car{width:14px;color:var(--sky);font-size:10px;flex:none}
.kids{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
main{position:relative;overflow:auto;background:radial-gradient(circle at 80% 0%,#04365f 0,var(--navy) 55%)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(2,26,48,.92);backdrop-filter:blur(8px);z-index:2}
.bar h1{margin:0;font:800 22px Montserrat,sans-serif;color:#fff;flex:1}.bar span{color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;padding:26px}
.it{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 14px;border-radius:14px;cursor:pointer;text-align:center;border:1px solid transparent;transition:.15s}
.it:hover{background:rgba(255,255,255,.07);border-color:var(--line);transform:translateY(-2px)}
.it svg{width:96px;height:96px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.it b{color:#fff;font-weight:600;line-height:1.25}.it small{color:var(--sky);font-size:12px}
.it.soon{opacity:.5;cursor:default}.it.soon:hover{transform:none;background:none;border-color:transparent}
.list{padding:10px 26px 30px}.list table{width:100%;border-collapse:collapse}
.list th{text-align:left;font:800 11px Montserrat,sans-serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
.list td{padding:10px 12px;border-bottom:1px solid rgba(138,181,214,.1)}.list tr.row{cursor:pointer}.list tr.row:hover td{background:rgba(255,255,255,.06)}
.list td:first-child{display:flex;align-items:center;gap:12px;color:#fff;font-weight:600}.list td svg{width:26px;height:26px}.list tr.soon{opacity:.45;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.pill.ok{background:rgba(51,214,160,.16);color:var(--green)}.pill.no{background:rgba(255,255,255,.08);color:var(--sky)}
.viewer{position:absolute;inset:0;background:#000;display:none}.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:40px;background:var(--navy)}.msg h2{font:800 28px Montserrat,sans-serif;color:#fff;margin:0 0 10px}.msg code{display:block;margin:14px auto;padding:10px 14px;background:rgba(255,255,255,.07);border-radius:8px;color:var(--gold);max-width:700px;word-break:break-all}.msg p{color:var(--sky);max-width:620px;margin:0 auto}
body.view main{overflow:hidden}body.view .viewer{display:block}body.view #exp{display:none}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:62px auto 1fr}nav{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}header{grid-column:1}}
</style></head><body>
<header><div class="logo" id="home">SHAHEEN<small>ACADEMY MUMBAI</small></div>
<button class="btn" id="up" title="Up one folder">↑ Up</button><div class="crumbs" id="crumbs"></div><div class="prog" id="prog"></div>
<button class="btn" id="prev">◀ Chapter</button><button class="btn" id="next">Chapter ▶</button><a class="btn" id="dl" style="display:none" download>⬇ File</a></header>
<nav id="nav"></nav>
<main id="main"><div id="exp"></div><div class="viewer" id="viewer"><div class="msg" id="msg"></div></div></main>
<script>
var MANIFEST={"school": "Shaheen Group of Institutions", "exam": "NEET", "classes": [{"id": "class-11", "name": "Class XI", "subjects": [{"id": "physics", "name": "Physics", "chapters": [{"n": 1, "id": "01-units-and-measurements", "title": "Units and Measurements", "status": "ready", "slides": 110, "kb": 388, "updated": "31 Oct 2026"}, {"n": 2, "id": "02-motion-in-a-straight-line", "title": "Motion in a Straight Line", "status": "soon"}, {"n": 3, "id": "03-motion-in-a-plane", "title": "Motion in a Plane", "status": "soon"}, {"n": 4, "id": "04-laws-of-motion", "title": "Laws of Motion", "status": "soon"}, {"n": 5, "id": "05-work-energy-and-power", "title": "Work, Energy and Power", "status": "soon"}, {"n": 6, "id": "06-system-of-particles-and-rotational-motion", "title": "System of Particles and Rotational Motion", "status": "soon"}, {"n": 7, "id": "07-gravitation", "title": "Gravitation", "status": "soon"}, {"n": 8, "id": "08-mechanical-properties-of-solids", "title": "Mechanical Properties of Solids", "status": "soon"}, {"n": 9, "id": "09-mechanical-properties-of-fluids", "title": "Mechanical Properties of Fluids", "status": "ready", "slides": 112, "kb": 313, "updated": "03 Nov 2026"}, {"n": 10, "id": "10-thermal-properties-of-matter", "title": "Thermal Properties of Matter", "status": "soon"}, {"n": 11, "id": "11-thermodynamics", "title": "Thermodynamics", "status": "soon"}, {"n": 12, "id": "12-kinetic-theory", "title": "Kinetic Theory", "status": "soon"}, {"n": 13, "id": "13-oscillations", "title": "Oscillations", "status": "soon"}, {"n": 14, "id": "14-waves", "title": "Waves", "status": "soon"}]}, {"id": "chemistry", "name": "Chemistry", "chapters": []}, {"id": "biology", "name": "Biology", "chapters": []}]}, {"id": "class-12", "name": "Class XII", "subjects": [{"id": "physics", "name": "Physics", "chapters": [{"n": 1, "id": "01-electric-charges-and-fields", "title": "Electric Charges and Fields", "status": "soon"}, {"n": 2, "id": "02-electrostatic-potential-and-capacitance", "title": "Electrostatic Potential and Capacitance", "status": "soon"}, {"n": 3, "id": "03-current-electricity", "title": "Current Electricity", "status": "soon"}, {"n": 4, "id": "04-moving-charges-and-magnetism", "title": "Moving Charges and Magnetism", "status": "soon"}, {"n": 5, "id": "05-magnetism-and-matter", "title": "Magnetism and Matter", "status": "soon"}, {"n": 6, "id": "06-electromagnetic-induction", "title": "Electromagnetic Induction", "status": "soon"}, {"n": 7, "id": "07-alternating-current", "title": "Alternating Current", "status": "soon"}, {"n": 8, "id": "08-electromagnetic-waves", "title": "Electromagnetic Waves", "status": "soon"}, {"n": 9, "id": "09-ray-optics-and-optical-instruments", "title": "Ray Optics and Optical Instruments", "status": "soon"}, {"n": 10, "id": "10-wave-optics", "title": "Wave Optics", "status": "soon"}, {"n": 11, "id": "11-dual-nature-of-radiation-and-matter", "title": "Dual Nature of Radiation and Matter", "status": "soon"}, {"n": 12, "id": "12-atoms", "title": "Atoms", "status": "soon"}, {"n": 13, "id": "13-nuclei", "title": "Nuclei", "status": "soon"}, {"n": 14, "id": "14-semiconductor-electronics", "title": "Semiconductor Electronics", "status": "soon"}]}, {"id": "chemistry", "name": "Chemistry", "chapters": []}, {"id": "biology", "name": "Biology", "chapters": []}]}]};
(function(){
var $=function(i){return document.getElementById(i)};
var ICON={
 folder:'<svg viewBox="0 0 96 96"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f2b705"/></linearGradient></defs><path d="M8 24a6 6 0 0 1 6-6h22l8 9h38a6 6 0 0 1 6 6v43a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="#c98f00"/><rect x="8" y="34" width="80" height="44" rx="6" fill="url(#fg)"/></svg>',
 file:'<svg viewBox="0 0 96 96"><path d="M22 8h38l18 18v56a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="#f4f8fc"/><path d="M60 8l18 18H66a6 6 0 0 1-6-6z" fill="#b9cfe3"/><rect x="16" y="40" width="62" height="30" rx="4" fill="#00569d"/><text x="47" y="61" text-anchor="middle" font-family="Montserrat,Arial" font-weight="800" font-size="16" fill="#fecd0b">SLIDES</text><rect x="26" y="76" width="42" height="4" rx="2" fill="#b9cfe3"/></svg>',
 soon:'<svg viewBox="0 0 96 96"><path d="M22 8h38l18 18v56a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="none" stroke="#8ab5d6" stroke-width="3" stroke-dasharray="6 5"/><text x="47" y="58" text-anchor="middle" font-family="Montserrat,Arial" font-weight="800" font-size="13" fill="#8ab5d6">SOON</text></svg>'};
/* ---- build tree ---- */
var root={id:'',name:'Shaheen Library',type:'folder',kids:[]};
MANIFEST.classes.forEach(function(c){var cn={id:c.id,name:c.name,type:'folder',parent:root,kids:[]};root.kids.push(cn);
 c.subjects.forEach(function(s){var sn={id:s.id,name:s.name,type:'folder',parent:cn,kids:[]};cn.kids.push(sn);
  s.chapters.forEach(function(ch){sn.kids.push({id:ch.id,name:ch.n+'. '+ch.title,title:ch.title,n:ch.n,type:'file',parent:sn,ch:ch,ready:ch.status==='ready',
   file:c.id+'/'+s.id+'/'+ch.id+'/index.html'})})})});
function pathOf(n){var a=[];while(n&&n.id){a.unshift(n.id);n=n.parent}return a}
function nodeAt(h){var n=root;h=h.replace(/^#?\/?/,'').replace(/\/$/,'');if(!h)return root;var p=h.split('/');for(var i=0;i<p.length;i++){var k=null;for(var j=0;j<n.kids.length;j++)if(n.kids[j].id===p[i])k=n.kids[j];if(!k)return root;n=k}return n}
function baseDir(){var p=location.pathname,last=p.split('/').pop();return /\.[a-z0-9]+$/i.test(last)?p.replace(/[^\/]*$/,''):p.replace(/\/?$/,'/')}
function fileURL(n){return baseDir()+n.file}
var cur=root,mode='grid';
function go(n){location.hash='#/'+pathOf(n).join('/')}
/* ---- render ---- */
function itemMeta(n){if(n.type==='folder'){var f=n.kids.length;return f+(f===1?' item':' items')}return n.ready?(n.ch.slides+' slides · '+n.ch.kb+' KB'):'Not uploaded yet'}
function renderTree(){var h='<div class="t">Library</div>';
 function walk(n,d){n.kids.forEach(function(k){var open=pathOf(cur).join('/').indexOf(pathOf(k).join('/'))===0,isCur=k===cur;
  if(k.type==='folder'){h+='<div class="tr'+(isCur?' cur':'')+'" data-p="'+pathOf(k).join('/')+'"><span class="car">'+(open?'▾':'▸')+'</span>'+ICON.folder+'<span>'+k.name+'</span></div>';if(open)h+='<div class="kids">'+sub(k)+'</div>'}
 })}
 function sub(n){var s='';n.kids.forEach(function(k){var open=pathOf(cur).join('/').indexOf(pathOf(k).join('/'))===0,isCur=k===cur;
  if(k.type==='folder'){s+='<div class="tr'+(isCur?' cur':'')+'" data-p="'+pathOf(k).join('/')+'"><span class="car">'+(open?'▾':'▸')+'</span>'+ICON.folder+'<span>'+k.name+'</span></div>';if(open)s+='<div class="kids">'+sub(k)+'</div>'}
  else s+='<div class="tr'+(isCur?' cur':'')+(k.ready?'':' soon')+'" data-p="'+(k.ready?pathOf(k).join('/'):'')+'"><span class="car"></span>'+(k.ready?ICON.file:ICON.soon)+'<span>'+k.name+'</span></div>'});return s}
 walk(root,0);$('nav').innerHTML=h;
 [].forEach.call($('nav').querySelectorAll('.tr'),function(e){e.onclick=function(){var p=e.getAttribute('data-p');if(p!=='' ||e.parentNode===$('nav'))location.hash='#/'+p}})}
function renderCrumbs(n){var a=[],x=n;while(x){a.unshift(x);x=x.parent}$('crumbs').innerHTML=a.map(function(k,i){return '<a data-p="'+pathOf(k).join('/')+'">'+(i?k.name.replace(/^\d+\.\s/,function(m){return m}):'Shaheen Library')+'</a>'}).join('<i>›</i>');
 [].forEach.call($('crumbs').querySelectorAll('a'),function(e){e.onclick=function(){var t=nodeAt(e.getAttribute('data-p'));go(t.type==='file'?t.parent:t)}})}
function renderExplorer(n){var kids=n.kids.slice(),h='<div class="bar"><h1>'+(n===root?'Shaheen Library':n.name)+' <span style="font:500 14px Inter">· '+itemMeta(n)+'</span></h1><button class="btn'+(mode==='grid'?' on':'')+'" data-m="grid">▦ Icons</button><button class="btn'+(mode==='list'?' on':'')+'" data-m="list">☰ Details</button></div>';
 if(mode==='grid'){h+='<div class="grid">'+kids.map(function(k){var ic=k.type==='folder'?ICON.folder:(k.ready?ICON.file:ICON.soon);return '<div class="it'+(k.type==='file'&&!k.ready?' soon':'')+'" data-p="'+pathOf(k).join('/')+'" data-r="'+(k.type==='folder'||k.ready?1:0)+'">'+ic+'<b>'+k.name+'</b><small>'+itemMeta(k)+'</small></div>'}).join('')+'</div>'}
 else{h+='<div class="list"><table><tr><th>Name</th><th>Type</th><th>Details</th><th>Modified</th><th>Status</th></tr>'+kids.map(function(k){var rd=k.type==='folder'||k.ready;return '<tr class="row'+(rd?'':' soon')+'" data-p="'+pathOf(k).join('/')+'" data-r="'+(rd?1:0)+'"><td>'+(k.type==='folder'?ICON.folder:(k.ready?ICON.file:ICON.soon))+k.name+'</td><td>'+(k.type==='folder'?'Folder':'Presentation')+'</td><td>'+itemMeta(k)+'</td><td>'+(k.ready?k.ch.updated:'—')+'</td><td>'+(k.type==='file'?'<span class="pill '+(k.ready?'ok':'no')+'">'+(k.ready?'Ready':'Soon')+'</span>':'')+'</td></tr>'}).join('')+'</table></div>'}
 $('exp').innerHTML=h;
 [].forEach.call($('exp').querySelectorAll('[data-m]'),function(b){b.onclick=function(){mode=b.getAttribute('data-m');renderExplorer(cur)}});
 [].forEach.call($('exp').querySelectorAll('[data-p]'),function(e){e.onclick=function(){if(e.getAttribute('data-r')==='1')location.hash='#/'+e.getAttribute('data-p')}})}
function siblings(n){return n.parent?n.parent.kids.filter(function(k){return k.ready}):[]}
function openFile(n){document.body.classList.add('view');var m=$('msg');m.style.display='none';var old=$('viewer').querySelector('iframe');if(old)old.remove();$('prog').textContent='';
 var url=fileURL(n);$('dl').style.display='';$('dl').href=url;$('dl').setAttribute('download',n.id+'.html');
 function load(){var f=document.createElement('iframe');f.src=url;f.setAttribute('allow','fullscreen');f.title=n.title;$('viewer').appendChild(f);setTimeout(function(){f.focus()},300)}
 if(location.protocol.indexOf('http')===0){fetch(url,{method:'GET',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;load()}).catch(function(){m.style.display='grid';m.innerHTML='<div><h2>File not found</h2><p>The portal looked for this presentation here:</p><code>'+url+'</code><p>Make sure the folder <b>'+n.file.replace(/\/index\.html$/,'')+'</b> (with its <b>index.html</b>) was uploaded together with the portal.</p></div>'})}
 else load()}
function route(){var n=nodeAt(location.hash);cur=n.type==='file'?n:n;renderTree();renderCrumbs(n);
 var s=n.type==='file'?siblings(n):[],i=s.indexOf(n);$('prev').disabled=!(n.type==='file'&&i>0);$('next').disabled=!(n.type==='file'&&i>=0&&i<s.length-1);
 $('up').disabled=(n===root);
 if(n.type==='file'&&n.ready){openFile(n)}else{document.body.classList.remove('view');$('dl').style.display='none';$('prog').textContent='';var old=$('viewer').querySelector('iframe');if(old)old.remove();renderExplorer(n.type==='file'?n.parent:n)}}
$('up').onclick=function(){if(cur.parent)go(cur.type==='file'?cur.parent:cur.parent)};
$('home').onclick=function(){go(root)};
$('prev').onclick=function(){var s=siblings(cur);var i=s.indexOf(cur);if(i>0)go(s[i-1])};
$('next').onclick=function(){var s=siblings(cur);var i=s.indexOf(cur);if(i>=0&&i<s.length-1)go(s[i+1])};
window.addEventListener('message',function(e){var d=e.data;if(!d||d.source!=='shaheen-deck')return;
 if(d.type==='slidechange')$('prog').textContent='Slide '+(d.index+1)+' / '+d.total;
 if(d.type==='next-chapter'){var s=siblings(cur),i=s.indexOf(cur);if(i>=0&&i<s.length-1)go(s[i+1]);else go(cur.parent)}});
window.addEventListener('hashchange',route);
if(!location.hash){var first=null;(function f(n){n.kids.forEach(function(k){if(!first&&k.type==='file'&&k.ready)first=k;if(k.kids)f(k)})})(root);}
route();
})();
</script></body></html>
